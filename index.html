<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#1a73e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>قارئ النصوص</title>
<link rel="icon" href="icon-192.svg">
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh}
.container{max-width:600px;margin:0 auto;padding:16px}
header{text-align:center;padding:24px 0 16px}
header h1{font-size:24px;color:#1a73e8}
header p{color:#666;font-size:13px;margin-top:4px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 1px 8px rgba(0,0,0,.06);margin-bottom:12px}
.drop-area{border:2px dashed #d0d5dd;border-radius:12px;padding:32px 16px;text-align:center;cursor:pointer;transition:.2s}
.drop-area.dragover,.drop-area:hover{border-color:#1a73e8;background:#f5f9ff}
.drop-area .icon{font-size:40px;color:#1a73e8;margin-bottom:8px}
.drop-area p{color:#5f6368;font-size:14px}
#preview{max-width:100%;max-height:280px;border-radius:10px;display:none;margin:0 auto}
.row{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;padding:13px;border:none;border-radius:10px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:#1a73e8;color:#fff}
.btn-primary:hover{background:#1557b0}
.btn-secondary{background:#e8eaed;color:#3c4043}
.btn-secondary:hover{background:#d2d5d9}
.btn:disabled{opacity:.5}
.bar{width:100%;height:4px;background:#e8eaed;border-radius:4px;overflow:hidden;margin-top:10px;display:none}
.bar-fill{height:100%;width:0;background:#1a73e8;transition:width .3s}
.result-wrap{margin-top:14px}
.result-wrap h3{font-size:14px;color:#3c4043;margin-bottom:6px}
.result-box{background:#f8f9fa;border-radius:10px;padding:14px;min-height:70px;border:1px solid #e8eaed;font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:break-word;text-align:right}
.actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.actions button{padding:7px 14px;border:1px solid #dadce0;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;color:#3c4043}
.actions button:hover{background:#f1f3f4}
.status{text-align:center;font-size:13px;color:#5f6368;padding:6px;margin-top:4px}
.spinner{width:18px;height:18px;border:3px solid #e8eaed;border-top-color:#1a73e8;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{text-align:center;font-size:12px;color:#999;margin-top:20px}
.confidence{display:inline-block;background:#e6f4ea;color:#137333;padding:2px 8px;border-radius:8px;font-size:11px;margin-top:4px}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>قارئ النصوص</h1>
    <p>استخراج النص من الصور — يدعم العربية والإنجليزية</p>
  </header>

  <div class="card">
    <div class="drop-area" id="dropArea">
      <div class="icon" id="uploadIcon">📷</div>
      <p id="dropText">اضغط أو اسحب صورة</p>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <img id="preview">
    </div>
    <div class="bar" id="bar"><div class="bar-fill" id="barFill"></div></div>

    <div class="row">
      <button class="btn btn-primary" id="cameraBtn">📸 كاميرا</button>
      <button class="btn btn-secondary" id="uploadBtn">🖼 معرض</button>
    </div>

    <div class="result-wrap">
      <h3>النص:</h3>
      <div class="result-box" id="result">...</div>
      <div id="confidence"></div>
      <div class="actions">
        <button id="copyBtn">📋 نسخ</button>
        <button id="clearBtn">🗑 مسح</button>
      </div>
    </div>

    <div id="status" class="status"></div>
  </div>
  <div class="hint">✓ يشتغل بدون إنترنت بعد أول تحميل</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
(function(){
var worker=null;

function log(msg){document.getElementById("status").innerHTML='<span class="spinner"></span> '+msg;}

function loadImage(file){
  return new Promise(function(resolve){
    var img=new Image();
    img.onload=function(){resolve(img);};
    img.src=URL.createObjectURL(file);
  });
}

function prepareCanvas(img){
  var w=img.width,h=img.height;
  var maxW=2400;
  if(w>maxW){var s=maxW/w;w=maxW;h=Math.round(h*s);}
  var c=document.createElement("canvas");c.width=w;c.height=h;
  c.getContext("2d").drawImage(img,0,0,w,h);
  return c;
}

function fixArabic(text){
  text=text.replace(/[\u0610-\u061A]/g,"");
  text=text.replace(/[\u064B-\u065F]/g,"");
  text=text.replace(/[\u0670]/g,"\u0651");
  text=text.replace(/\u0622/g,"\u0627");
  text=text.replace(/\u0623/g,"\u0627");
  text=text.replace(/\u0625/g,"\u0627");
  text=text.replace(/\u0649/g,"\u064A");
  text=text.replace(/\u06CC/g,"\u064A");
  text=text.replace(/\u0629/g,"\u0647");
  text=text.replace(/\u0640/g,"");
  text=text.replace(/[^\S\n]+/g," ");
  text=text.replace(/\n{3,}/g,"\n\n");
  text=text.replace(/^[\s]+|[\s]+$/gm,"");
  return text.trim();
}

async function initWorker(){
  if(!worker){
    log("تحميل النموذج...");
    worker=await Tesseract.createWorker("ara+eng",1,{
      langPath:"https://tessdata.projectnaptha.com/4.0.0_best"
    });
  }
  return worker;
}

async function processImage(file){
  var resultEl=document.getElementById("result");
  var barEl=document.getElementById("bar");
  var barFill=document.getElementById("barFill");
  var statusEl=document.getElementById("status");
  var confEl=document.getElementById("confidence");

  resultEl.textContent="...";
  confEl.textContent="";
  barEl.style.display="block";
  barFill.style.width="0%";
  statusEl.innerHTML='<span class="spinner"></span> تحميل الصورة...';

  try{
    var img=await loadImage(file);
    barFill.style.width="10%";

    var canvas=prepareCanvas(img);

    statusEl.innerHTML='<span class="spinner"></span> تحميل النموذج...';
    await initWorker();
    barFill.style.width="30%";

    statusEl.innerHTML='<span class="spinner"></span> قراءة النص...';
    barFill.style.width="50%";

    var result=await worker.recognize(canvas);
    barFill.style.width="90%";

    var words=result.data.words||[];
    var lines=result.data.lines||[];
    var text="";
    var totalConf=0;
    var count=0;

    for(var i=0;i<lines.length;i++){
      var line=lines[i];
      if(line.confidence>40){
        text+=line.text.trim()+"\n";
        totalConf+=line.confidence;
        count++;
      }
    }

    text=text.trim();
    if(!text) text="(ما لقيت نص)";
    else text=fixArabic(text);

    var avgConf=count>0?Math.round(totalConf/count):0;

    barFill.style.width="100%";
    resultEl.textContent=text;
    confEl.innerHTML='<span class="confidence">الثقة: '+avgConf+'%</span>';
    statusEl.textContent="✅ تم";
  }catch(e){
    barEl.style.display="none";
    statusEl.textContent="❌ "+e.message;
  }
}

function showPreview(file){
  var r=new FileReader();
  r.onload=function(e){
    var p=document.getElementById("preview");
    p.src=e.target.result;p.style.display="block";
    document.getElementById("uploadIcon").style.display="none";
    document.getElementById("dropText").textContent=file.name;
  };
  r.readAsDataURL(file);
}

var dropArea=document.getElementById("dropArea");
var fileInput=document.getElementById("fileInput");

dropArea.onclick=function(){fileInput.click();};
fileInput.onchange=function(){if(fileInput.files[0]){showPreview(fileInput.files[0]);processImage(fileInput.files[0]);}};
dropArea.ondragover=function(e){e.preventDefault();dropArea.classList.add("dragover");};
dropArea.ondragleave=function(){dropArea.classList.remove("dragover");};
dropArea.ondrop=function(e){
  e.preventDefault();dropArea.classList.remove("dragover");
  if(e.dataTransfer.files[0]){fileInput.files=e.dataTransfer.files;showPreview(e.dataTransfer.files[0]);processImage(e.dataTransfer.files[0]);}
};

document.getElementById("cameraBtn").onclick=function(){fileInput.setAttribute("capture","environment");fileInput.click();fileInput.removeAttribute("capture");};
document.getElementById("uploadBtn").onclick=function(){fileInput.removeAttribute("capture");fileInput.click();};
document.getElementById("copyBtn").onclick=function(){navigator.clipboard.writeText(document.getElementById("result").textContent).then(function(){alert("تم النسخ!");});};
document.getElementById("clearBtn").onclick=function(){
  document.getElementById("result").textContent="...";
  document.getElementById("confidence").textContent="";
  fileInput.value="";
  document.getElementById("bar").style.display="none";
  document.getElementById("status").textContent="";
  document.getElementById("preview").style.display="none";
  document.getElementById("uploadIcon").style.display="";
  document.getElementById("dropText").textContent="اضغط أو اسحب صورة";
};

initWorker();
})();
</script>
</body>
</html>
