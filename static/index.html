<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قارئ النصوص — OCR</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: #f0f2f5; color: #1a1a2e; min-height: 100vh; }
.container { max-width: 700px; margin: 0 auto; padding: 20px; }
header { text-align: center; padding: 30px 0; }
header h1 { font-size: 28px; color: #1a73e8; margin-bottom: 8px; }
header p { color: #666; font-size: 14px; }
.badges { display: flex; justify-content: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.badge { padding: 4px 12px; border-radius: 12px; font-size: 12px; }
.badge-green { background: #e6f4ea; color: #137333; }
.badge-orange { background: #fef7e0; color: #b06000; }
.card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 16px; }
.upload-area { border: 2px dashed #ddd; border-radius: 12px; padding: 40px 20px; text-align: center; cursor: pointer; transition: 0.3s; }
.upload-area:hover, .upload-area.dragover { border-color: #1a73e8; background: #f0f7ff; }
.upload-area img { max-width: 100%; max-height: 300px; border-radius: 8px; display: none; }
.upload-area .icon { font-size: 48px; color: #1a73e8; margin-bottom: 12px; }
.upload-area p { color: #666; }
.buttons { display: flex; gap: 12px; margin-top: 16px; }
.btn { flex: 1; padding: 14px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn-primary { background: #1a73e8; color: white; }
.btn-primary:hover { background: #1557b0; }
.btn-secondary { background: #e8eaed; color: #333; }
.btn-secondary:hover { background: #d2d5d9; }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }
.spinner { width: 20px; height: 20px; border: 3px solid #ddd; border-top-color: #1a73e8; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.result-area { margin-top: 16px; }
.result-area h3 { margin-bottom: 8px; color: #333; }
.result-text { background: #f8f9fa; border-radius: 8px; padding: 16px; min-height: 80px; white-space: pre-wrap; font-size: 16px; line-height: 1.8; border: 1px solid #e0e0e0; direction: rtl; text-align: right; }
.result-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.result-actions button { padding: 8px 16px; border: 1px solid #ddd; border-radius: 6px; background: white; cursor: pointer; font-size: 13px; }
.result-actions button:hover { background: #f0f0f0; }
.status { text-align: center; padding: 8px; color: #666; font-size: 14px; }
.toggle-wrap { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 16px; font-size: 14px; color: #666; }
.switch { position: relative; width: 48px; height: 26px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; inset: 0; background: #ccc; border-radius: 26px; cursor: pointer; transition: 0.3s; }
.slider::before { content: ""; position: absolute; left: 3px; bottom: 3px; width: 20px; height: 20px; background: white; border-radius: 50%; transition: 0.3s; }
.switch input:checked + .slider { background: #1a73e8; }
.switch input:checked + .slider::before { transform: translateX(22px); }
.progress-bar { width: 100%; height: 4px; background: #e0e0e0; border-radius: 2px; overflow: hidden; margin-top: 8px; display: none; }
.progress-fill { height: 100%; width: 0%; background: #1a73e8; transition: width 0.3s; }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>قارئ النصوص</h1>
    <p>تعريب النصوص من الصور — يدعم العربية والإنجليزية</p>
    <div class="badges">
      <span class="badge badge-orange" id="engineBadge">🔧 Tesseract.js (متصفح)</span>
      <span class="badge badge-green">✓ مجاني 100%</span>
    </div>
  </header>

  <div class="card">
    <div class="toggle-wrap">
      <span>🔧 Tesseract.js (متصفح)</span>
      <label class="switch">
        <input type="checkbox" id="engineToggle">
        <span class="slider"></span>
      </label>
      <span>🚀 PaddleOCR (سيرفر)</span>
    </div>

    <div class="upload-area" id="uploadArea">
      <div class="icon">📷</div>
      <p>اختر صورة أو اسحبها هنا</p>
      <p style="font-size: 12px; color: #999; margin-top: 4px;">يدعم JPG, PNG, BMP</p>
      <img id="preview" style="display:none; margin-top: 12px;">
      <input type="file" id="fileInput" accept="image/*" hidden>
    </div>
    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>

    <div class="buttons">
      <button class="btn btn-primary" id="cameraBtn">📸 كاميرا</button>
      <button class="btn btn-secondary" id="uploadBtn">🖼 معرض</button>
    </div>

    <div class="result-area">
      <h3>النص المستخرج:</h3>
      <div class="result-text" id="result">...</div>
      <div class="result-actions">
        <button id="copyBtn">📋 نسخ</button>
        <button id="clearBtn">🗑 مسح</button>
      </div>
    </div>

    <div id="status" class="status"></div>
  </div>
</div>

<script>
const SERVER_URL = "http://localhost:10000";
const uploadArea = document.getElementById("uploadArea");
const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");
const resultDiv = document.getElementById("result");
const statusDiv = document.getElementById("status");
const engineToggle = document.getElementById("engineToggle");
const engineBadge = document.getElementById("engineBadge");
const progressBar = document.getElementById("progressBar");
const progressFill = document.getElementById("progressFill");

let tesseractWorker = null;
let serverOnline = false;

async function getWorker() {
  if (!tesseractWorker) {
    tesseractWorker = await Tesseract.createWorker("ara");
  }
  return tesseractWorker;
}

async function checkServer() {
  try {
    let r = await fetch(`${SERVER_URL}/health`, { signal: AbortSignal.timeout(3000) });
    serverOnline = r.ok;
  } catch { serverOnline = false; }
  if (engineToggle.checked && !serverOnline) {
    engineToggle.checked = false;
    updateEngineBadge();
  }
}
checkServer();

function updateEngineBadge() {
  if (engineToggle.checked) {
    engineBadge.textContent = "🚀 PaddleOCR (سيرفر) ✓";
    engineBadge.className = "badge badge-green";
  } else {
    engineBadge.textContent = "🔧 Tesseract.js (متصفح)";
    engineBadge.className = "badge badge-orange";
  }
}

engineToggle.addEventListener("change", async () => {
  if (engineToggle.checked && !serverOnline) {
    let ok = await fetch(`${SERVER_URL}/health`, { signal: AbortSignal.timeout(3000) }).then(r=>r.ok).catch(()=>false);
    if (!ok) {
      engineToggle.checked = false;
      statusDiv.textContent = "❌ سيرفر PaddleOCR غير متصل";
      return;
    }
    serverOnline = true;
  }
  updateEngineBadge();
});

async function processImage(file) {
  resultDiv.textContent = "...";
  statusDiv.innerHTML = '<span class="spinner"></span> جاري القراءة...';
  progressBar.style.display = "block";
  progressFill.style.width = "0%";

  try {
    if (engineToggle.checked && serverOnline) {
      const formData = new FormData();
      formData.append("file", file);
      let r = await fetch(`${SERVER_URL}/ocr`, { method: "POST", body: formData });
      if (!r.ok) throw new Error("خطأ في السيرفر");
      let data = await r.json();
      resultDiv.textContent = data.text || "(لا يوجد نص)";
      progressFill.style.width = "100%";
      statusDiv.textContent = "✅ تمت القراءة (PaddleOCR)";
    } else {
      const worker = await getWorker();
      const { data } = await worker.recognize(file, "ara", {}, { pages: false, text: true });
      resultDiv.textContent = data.text || "(لا يوجد نص)";
      progressFill.style.width = "100%";
      statusDiv.textContent = "✅ تمت القراءة (Tesseract.js)";
    }
  } catch (e) {
    progressBar.style.display = "none";
    statusDiv.textContent = "❌ " + e.message;
  }
}

async function uploadImage(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    preview.src = e.target.result;
    preview.style.display = "block";
    uploadArea.querySelector(".icon").style.display = "none";
    uploadArea.querySelectorAll("p").forEach(p => p.style.display = "none");
  };
  reader.readAsDataURL(file);
}

uploadArea.onclick = () => fileInput.click();
fileInput.onchange = async () => {
  if (fileInput.files[0]) {
    await uploadImage(fileInput.files[0]);
    await processImage(fileInput.files[0]);
  }
};

uploadArea.ondragover = (e) => { e.preventDefault(); uploadArea.classList.add("dragover"); };
uploadArea.ondragleave = () => uploadArea.classList.remove("dragover");
uploadArea.ondrop = async (e) => {
  e.preventDefault();
  uploadArea.classList.remove("dragover");
  if (e.dataTransfer.files[0]) {
    fileInput.files = e.dataTransfer.files;
    await uploadImage(e.dataTransfer.files[0]);
    await processImage(e.dataTransfer.files[0]);
  }
};

document.getElementById("cameraBtn").onclick = () => {
  fileInput.setAttribute("capture", "environment");
  fileInput.click();
  fileInput.removeAttribute("capture");
};

document.getElementById("uploadBtn").onclick = () => {
  fileInput.removeAttribute("capture");
  fileInput.click();
};

document.getElementById("copyBtn").onclick = () => {
  navigator.clipboard.writeText(resultDiv.textContent);
  alert("تم النسخ!");
};

document.getElementById("clearBtn").onclick = () => {
  resultDiv.textContent = "...";
  preview.style.display = "none";
  uploadArea.querySelector(".icon").style.display = "";
  uploadArea.querySelectorAll("p").forEach(p => p.style.display = "");
  fileInput.value = "";
  progressBar.style.display = "none";
  statusDiv.textContent = "";
};
</script>
</body>
</html>
